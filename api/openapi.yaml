openapi: 3.1.0
info:
  title: budget-planner API
  version: 0.1.0
  description: |
    Mini App API. Every request carries Telegram Mini App init data:
    `Authorization: tma <initData>`. The backend validates it with the bot token.

    Money is always an integer in ISO 4217 minor units plus a currency code.
    UZS and USD are never added together; totals are reported per currency.
    Dates are calendar dates (YYYY-MM-DD) in the user's time zone.

    Any endpoint may answer 429 `rate_limited` with a `Retry-After` header (seconds):
    about 10 requests per second per user and 30 per IP address.
servers:
  - url: /api
security:
  - tma: []

paths:
  /me:
    get:
      summary: Current user and settings
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
    patch:
      summary: Update settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { $ref: "#/components/schemas/Language" }
                main_currency: { $ref: "#/components/schemas/Currency" }
                timezone: { type: string, example: Asia/Tashkent }
                notify_enabled: { type: boolean, description: Evening summary in the bot }
                notify_time: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", example: "21:00", description: Local time of the evening summary }
                accept_terms: { type: boolean, const: true, description: Accept the current terms and privacy policy }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
    delete:
      summary: Delete the account and all data, permanently. The next request starts a new, empty account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, const: delete }
      responses:
        "204": { description: Deleted }
        "422": { $ref: "#/components/responses/Invalid" }

  /me/export:
    post:
      summary: "Send the user's data into their bot chat: transactions as CSV and everything as JSON. At most once per 10 minutes."
      responses:
        "202": { description: Sent, content: { application/json: { schema: { type: object, required: [sent], properties: { sent: { type: boolean } } } } } }
        "409": { description: "bot_blocked: the user never started the bot or blocked it", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "rate_limited: an export was sent within the last 10 minutes", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /voice:
    post:
      summary: "Transcribe a voice recording and suggest transactions from it. Saves nothing: open the suggestions in the form for the user to confirm. At most 5 in a burst, then one per 5 seconds."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary, description: "At most 2 MB and 60 s. The part's Content-Type must be audio/wav (16 kHz mono PCM recommended), audio/ogg, audio/mp4 or audio/mpeg." }
      responses:
        "200":
          description: "What was heard, and one suggestion per amount found (empty when none)"
          content:
            application/json:
              schema:
                type: object
                required: [text, items]
                properties:
                  text: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [type, amount_minor, currency, description, category_id, account_id, occurred_on, needs_review]
                      properties:
                        type: { type: string, enum: [expense, income] }
                        amount_minor: { type: integer, format: int64 }
                        currency: { type: string, enum: [UZS, USD] }
                        description: { type: string }
                        category_id: { type: integer, format: int64 }
                        account_id: { type: [integer, "null"], format: int64, description: "Account last used for this description" }
                        occurred_on: { type: string, format: date }
                        needs_review: { type: boolean, description: "Amount is probably shorthand (\"taksi 25\"); highlight it" }
        "400": { description: "invalid: missing, too large, too long or unsupported audio", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: rate_limited, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: "voice_failed: the recording could not be recognized", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "voice_unavailable: no speech-to-text provider configured", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /me/avatar:
    get:
      summary: "The user's Telegram profile photo (JPEG), proxied. Use it when initDataUnsafe.user.photo_url is missing; fetch with the auth header and show via an object URL. 404 when there is no photo or privacy hides it."
      responses:
        "200": { description: JPEG image, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /accounts:
    get:
      summary: User's money accounts with current balances
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { accounts: { type: array, items: { $ref: "#/components/schemas/Account" } } } }
    post:
      summary: Create an account; a non-zero opening balance is recorded as an opening transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, currency]
              properties:
                name: { type: string, maxLength: 64 }
                type: { $ref: "#/components/schemas/AccountType" }
                currency: { $ref: "#/components/schemas/Currency" }
                opening_balance_minor: { type: integer, format: int64, default: 0 }
                color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
                include_in_total: { type: boolean, default: true }
                card_mask: { type: string, pattern: "^[0-9]{4}$" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "422": { $ref: "#/components/responses/Invalid" }

  /accounts/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      summary: Rename, archive or style an account. color and card_mask accept null to clear.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64 }
                archived: { type: boolean }
                color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
                include_in_total: { type: boolean, description: "false leaves this account out of Summary.balances (e.g. savings)" }
                card_mask: { type: [string, "null"], pattern: "^[0-9]{4}$", description: "Last 4 digits; forwarded bank messages for this card land here. Moves the card from any other account." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /categories:
    get:
      summary: Default and user categories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { categories: { type: array, items: { $ref: "#/components/schemas/Category" } } } }

  /transactions:
    get:
      summary: History, newest first, cursor-paginated
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: account_id, in: query, schema: { type: integer, format: int64 } }
        - { name: category_id, in: query, schema: { type: integer, format: int64 } }
        - { name: type, in: query, description: "One type or several, comma-separated: expense,installment", schema: { type: string } }
        - { name: currency, in: query, schema: { $ref: "#/components/schemas/Currency" } }
        - { name: q, in: query, description: Search in description, schema: { type: string } }
        - { name: debt_id, in: query, description: Transactions of one debt (404 if not the user's), schema: { type: integer, format: int64 } }
        - { name: installment_id, in: query, description: Transactions of one installment plan (404 if not the user's), schema: { type: integer, format: int64 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
                  next_cursor: { type: [string, "null"] }
    post:
      summary: Record income, expense, transfer or currency exchange
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransactionInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "200": { description: Already recorded (same source_ref), content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "422": { $ref: "#/components/responses/Invalid" }

  /transactions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One transaction
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Replace a transaction (edit)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransactionInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      summary: Delete (soft); can be undone with restore
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /transactions/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Undo a delete. Works for repayments and plan payments too, unless restoring would pay back more than is owed.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "code overpayment", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /savings:
    get:
      summary: "Money put into and taken out of savings accounts (type savings) per month, for the last N months including the current one. Months without movement are omitted. Opening balances don't count. Balances come from GET /accounts."
      parameters:
        - { name: months, in: query, schema: { type: integer, minimum: 1, maximum: 36, default: 12 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [current_month, months]
                properties:
                  current_month: { type: string, example: "2026-10", description: "In the user's time zone" }
                  months:
                    type: array
                    items:
                      type: object
                      required: [month, currency, put_in_minor, taken_out_minor]
                      properties:
                        month: { type: string, example: "2026-10" }
                        currency: { type: string, enum: [UZS, USD] }
                        put_in_minor: { type: integer, format: int64 }
                        taken_out_minor: { type: integer, format: int64 }
        "400": { description: invalid months, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /summary:
    get:
      summary: Home screen data for one month
      parameters:
        - { name: month, in: query, description: "YYYY-MM; default current month in user's time zone", schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Summary" } } } }

  /debts:
    get:
      summary: Debts (qarz), open and closed, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { debts: { type: array, items: { $ref: "#/components/schemas/Debt" } } } }
    post:
      summary: Record money lent or borrowed. Neither income nor expense.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, counterparty, currency, amount_minor, occurred_on]
              properties:
                direction: { type: string, enum: [lent, borrowed] }
                counterparty: { type: string, maxLength: 64 }
                currency: { $ref: "#/components/schemas/Currency" }
                amount_minor: { type: integer, format: int64, minimum: 1 }
                account_id: { type: [integer, "null"], format: int64, description: "Account the money left (lent) or arrived in (borrowed). Omit for a debt from before tracking: no balance changes." }
                occurred_on: { type: string, format: date }
                due_on: { type: [string, "null"], format: date, description: "Not before occurred_on (422 invalid_due_date)" }
                note: { type: string, maxLength: 200 }
      description: account_id must be in the debt's currency (422 currency_mismatch).
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Debt" } } } }
        "422": { $ref: "#/components/responses/Invalid" }

  /debts/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: A debt with its transactions (the debt itself and every repayment)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  debt: { $ref: "#/components/schemas/Debt" }
                  transactions: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit name, note or due date. due_on absent keeps it, null clears it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                counterparty: { type: string, maxLength: 64 }
                note: { type: string, maxLength: 200 }
                due_on: { type: [string, "null"], format: date }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Debt" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete the debt and all its transactions
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /debts/{id}/payments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Repayment — money back to you (lent) or paid back by you (borrowed). Undo it by deleting the returned transaction.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PaymentInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "422": { description: "Validation failed; code overpayment when amount exceeds what is owed", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /installments:
    get:
      summary: Installment plans (nasiya), newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { installments: { type: array, items: { $ref: "#/components/schemas/Installment" } } } }
    post:
      summary: Buy on installment. The purchase is one expense on occurred_on; payments only reduce the debt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category_id, currency, total_minor, months, first_due_on, occurred_on]
              properties:
                title: { type: string, maxLength: 64, example: iPhone 16 }
                provider: { type: string, maxLength: 64, example: Uzum Nasiya }
                category_id: { type: integer, format: int64, description: Expense category of the purchase }
                currency: { $ref: "#/components/schemas/Currency" }
                total_minor: { type: integer, format: int64 }
                months: { type: integer, minimum: 1, maximum: 60, description: "total_minor must be at least months × 100 (one so'm or dollar per payment)" }
                first_due_on: { type: string, format: date, description: Within a year after occurred_on }
                pay_from_account_id: { type: [integer, "null"], format: int64, description: Default account for payments }
                occurred_on: { type: string, format: date, description: Purchase date }
                record_purchase: { type: boolean, default: true, description: "false for a plan started before tracking: the debt is recorded but the past purchase is not counted as spending" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Installment" } } } }
        "422": { $ref: "#/components/responses/Invalid" }

  /installments/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: A plan with its schedule
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Installment" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete the plan and all its transactions
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /installments/{id}/payments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Pay. amount_minor 0 or omitted pays the rest of the next due payment.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PaymentInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "422": { description: "Validation failed; code overpayment when amount exceeds what is left", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /budgets:
    get:
      summary: Monthly budgets with spending in the month
      parameters:
        - { name: month, in: query, description: "YYYY-MM; default current month in user's time zone", schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [month, days_left, budgets]
                properties:
                  month: { type: string, example: 2026-10 }
                  days_left: { type: integer, description: "Days left in the month after today (today not included); 0 for a past month. A daily pace that counts today divides by days_left + 1." }
                  budgets: { type: array, items: { $ref: "#/components/schemas/Budget" } }
    post:
      summary: Create a budget. One per category and currency; category_id null is the overall monthly limit. A budget is the same limit every month.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, amount_minor]
              properties:
                category_id: { type: [integer, "null"], format: int64, description: Expense category; null for overall }
                currency: { $ref: "#/components/schemas/Currency" }
                amount_minor: { type: integer, format: int64, minimum: 1 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }
        "422": { description: "Validation failed; code budget_exists for a duplicate", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /budgets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      summary: Change the limit (applies to every month, including the current one)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount_minor], properties: { amount_minor: { type: integer, format: int64, minimum: 1 } } }
      responses:
        "200": { description: Updated, with this month's spending, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /plan:
    parameters:
      - { name: month, in: query, description: "YYYY-MM; default: current month, or next month from the 20th", schema: { type: string } }
      - { name: currency, in: query, description: Default the user's main currency, schema: { $ref: "#/components/schemas/Currency" } }
    get:
      summary: The month's spending plan with inputs and recommendations. Created on first use, carrying over unbought items from the month before.
      parameters:
        - { name: create, in: query, description: "false: only return an existing plan (404 if none) — for previews like Home", schema: { type: boolean, default: true } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Adjust inputs. For income_override, income_day and buffer_override, absent keeps, null clears, a value sets.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                income_override: { type: [integer, "null"], format: int64, minimum: 0 }
                income_day: { type: [integer, "null"], minimum: 1, maximum: 31 }
                savings_minor: { type: integer, format: int64, minimum: 0 }
                buffer_override: { type: [integer, "null"], format: int64, minimum: 0 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "422": { $ref: "#/components/responses/Invalid" }

  /plan/items:
    parameters:
      - { name: month, in: query, schema: { type: string } }
      - { name: currency, in: query, schema: { $ref: "#/components/schemas/Currency" } }
    post:
      summary: Add 1–50 items
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/NewPlanItem" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "422": { $ref: "#/components/responses/Invalid" }

  /plan/parse:
    parameters:
      - { name: currency, in: query, schema: { $ref: "#/components/schemas/Currency" } }
    post:
      summary: "Amounts are so'm unless written in dollars ($20, 20 dollar): in a USD plan, so'm amounts are skipped, never read as dollars. Preview items from free text (\"ijara 3 mln, kurtka 700-900 ming, AirPods 2.5 mln agar bo'lsa\") with suggested category and priority. Nothing is saved; send the items to POST /plan/items."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string } } } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/NewPlanItem" } } } }

  /plan/items/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      summary: Edit, change status (bought links transaction_id), or re-prioritize. category_id, due_on and transaction_id accept null to clear.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                category_id: { type: [integer, "null"], format: int64 }
                amount_min_minor: { type: integer, format: int64 }
                amount_max_minor: { type: integer, format: int64 }
                priority: { type: string, enum: [must, should, nice] }
                due_on: { type: [string, "null"], format: date }
                status: { type: string, enum: [planned, bought, postponed, dropped] }
                transaction_id: { type: [integer, "null"], format: int64 }
                note: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      summary: Delete; returns the recalculated plan
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanView" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /recurring:
    get:
      summary: Recurring income and bills. Not posted automatically; they feed the plan.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { recurring: { type: array, items: { $ref: "#/components/schemas/Recurring" } } } }
    post:
      summary: Add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, title, currency, amount_minor, day_of_month]
              properties:
                kind: { type: string, enum: [income, expense] }
                title: { type: string, maxLength: 64 }
                category_id: { type: [integer, "null"], format: int64, description: Category of the same kind }
                currency: { $ref: "#/components/schemas/Currency" }
                amount_minor: { type: integer, format: int64, minimum: 1 }
                day_of_month: { type: integer, minimum: 1, maximum: 31, description: "Clamped to the month's last day" }
                account_id: { type: [integer, "null"], format: int64 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Recurring" } } } }
        "422": { $ref: "#/components/responses/Invalid" }

  /recurring/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      summary: Edit. Kind and currency are fixed (delete and re-add to change them); category_id and account_id accept null to clear.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                amount_minor: { type: integer, format: int64, minimum: 1 }
                day_of_month: { type: integer, minimum: 1, maximum: 31 }
                category_id: { type: [integer, "null"], format: int64, description: Category of the same kind }
                account_id: { type: [integer, "null"], format: int64, description: Account in the same currency }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Recurring" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    tma:
      type: apiKey
      in: header
      name: Authorization
      description: "`tma <initData>` from Telegram.WebApp.initData"

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }

  responses:
    NotFound:
      description: Not found or not owned by the user
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Invalid:
      description: Validation failed
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_amount }
            message: { type: string }
            field: { type: string }

    Currency: { type: string, enum: [UZS, USD] }
    Language: { type: string, enum: [uz-Latn, uz-Cyrl, ru, en] }
    AccountType: { type: string, enum: [cash, humo, uzcard, visa, mastercard, savings, other] }
    TransactionType:
      type: string
      enum: [expense, income, transfer, exchange, opening, debt, debt_payment, installment, installment_payment]
      description: |
        transfer: between own accounts in one currency (never income or expense).
        exchange: between own accounts in different currencies.
        opening: opening balance, created by the server only.
        debt, debt_payment: money lent/borrowed and repayments (never income or expense). Created via /debts.
        installment: a purchase on installment (an expense, once). installment_payment: a payment on the plan
        (not an expense). Created via /installments.
        Transactions of these four types are read-only through /transactions (PUT returns 422
        managed_elsewhere); debt_payment and installment_payment can be deleted to undo them.
    Source: { type: string, enum: [manual, chat, voice, bank, receipt] }

    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64 }
        currency: { $ref: "#/components/schemas/Currency" }

    User:
      type: object
      required: [id, telegram_id, first_name, language, main_currency, timezone, onboarded, notify_enabled, notify_time, created_at, terms_accepted, voice_enabled]
      properties:
        id: { type: integer, format: int64 }
        telegram_id: { type: integer, format: int64 }
        first_name: { type: string }
        username: { type: [string, "null"] }
        language: { $ref: "#/components/schemas/Language" }
        main_currency: { $ref: "#/components/schemas/Currency" }
        timezone: { type: string }
        onboarded: { type: boolean, description: True once the user has at least one account }
        notify_enabled: { type: boolean, description: Evening summary in the bot }
        notify_time: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", example: "21:00", description: "HH:MM, local time of the evening summary" }
        created_at: { type: string, format: date-time, description: First contact with the bot or app ("with us since") }
        terms_accepted: { type: boolean, description: "Accepted the current version of the terms and privacy policy; when false, ask before continuing" }
        voice_enabled: { type: boolean, description: "POST /voice works; when false, the mic button says voice is coming soon" }

    Account:
      type: object
      required: [id, name, type, currency, balance_minor, archived, color, include_in_total, card_mask]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        currency: { $ref: "#/components/schemas/Currency" }
        balance_minor: { type: integer, format: int64 }
        archived: { type: boolean }
        color: { type: [string, "null"], description: "#RRGGBB; null lets the app choose by type" }
        include_in_total: { type: boolean }
        card_mask: { type: [string, "null"], description: Last 4 digits of the card }

    Category:
      type: object
      required: [id, kind, key, icon]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [expense, income] }
        key: { type: [string, "null"], description: i18n key for default categories, e.g. "taxi"; null for custom }
        name: { type: [string, "null"], description: Custom name; null for defaults (translate key) }
        icon: { type: string, description: Emoji }

    TransactionInput:
      type: object
      required: [type, occurred_on, amount_minor, account_id]
      properties:
        type: { type: string, enum: [expense, income, transfer, exchange] }
        occurred_on: { type: string, format: date }
        amount_minor: { type: integer, format: int64, minimum: 1, description: Positive; in account_id's currency }
        account_id: { type: integer, format: int64, description: Source account for expense/transfer/exchange, target for income }
        to_account_id: { type: integer, format: int64, description: Required for transfer and exchange }
        to_amount_minor: { type: integer, format: int64, minimum: 1, description: Required for exchange; in to_account_id's currency }
        category_id: { type: integer, format: int64, description: Required for expense and income }
        description: { type: string, maxLength: 200 }
        source: { $ref: "#/components/schemas/Source" }
        source_ref: { type: string, description: Idempotency key, e.g. Telegram update id; repeats return the existing transaction }

    PaymentInput:
      type: object
      required: [account_id, occurred_on]
      description: The account's currency must match the debt or plan (422 currency_mismatch).
      properties:
        amount_minor: { type: integer, format: int64, minimum: 0, description: "Debts: required, positive. Installments: 0 or omitted pays the rest of the next payment." }
        account_id: { type: integer, format: int64 }
        occurred_on: { type: string, format: date }

    Debt:
      type: object
      required: [id, direction, counterparty, currency, principal_minor, remaining_minor, due_on, note, closed, created_at, occurred_on, account_id]
      properties:
        id: { type: integer, format: int64 }
        direction: { type: string, enum: [lent, borrowed], description: "lent: they owe you; borrowed: you owe them" }
        counterparty: { type: string }
        currency: { $ref: "#/components/schemas/Currency" }
        principal_minor: { type: integer, format: int64 }
        remaining_minor: { type: integer, format: int64, description: Still owed }
        due_on: { type: [string, "null"], format: date }
        note: { type: string }
        closed: { type: boolean, description: remaining_minor is 0 }
        created_at: { type: string, format: date-time }
        occurred_on: { type: string, format: date, description: When the money was lent or borrowed }
        account_id: { type: [integer, "null"], format: int64, description: Account the money moved through; null for a debt from before tracking }

    ScheduleRow:
      type: object
      required: [n, due_on, amount_minor, paid]
      properties:
        n: { type: integer }
        due_on: { type: string, format: date }
        amount_minor: { type: integer, format: int64, description: "In next: what is left of this payment after partial payments" }
        paid: { type: boolean }

    Installment:
      type: object
      required: [id, title, provider, category_id, currency, total_minor, paid_minor, remaining_minor, months, pay_from_account_id, next, schedule, closed, created_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        provider: { type: string }
        category_id: { type: integer, format: int64 }
        currency: { $ref: "#/components/schemas/Currency" }
        total_minor: { type: integer, format: int64 }
        paid_minor: { type: integer, format: int64 }
        remaining_minor: { type: integer, format: int64 }
        months: { type: integer }
        pay_from_account_id: { type: [integer, "null"], format: int64 }
        next: { oneOf: [{ $ref: "#/components/schemas/ScheduleRow" }, { type: "null" }] }
        schedule: { type: array, items: { $ref: "#/components/schemas/ScheduleRow" } }
        closed: { type: boolean }
        created_at: { type: string, format: date-time }

    Budget:
      type: object
      required: [id, category_id, currency, amount_minor, spent_minor, remaining_minor]
      description: "The bot alerts once per month when spent_minor ≥ 80% of amount_minor and once when ≥ 100%. Drill down with type=expense,installment."
      properties:
        id: { type: integer, format: int64 }
        category_id: { type: [integer, "null"], format: int64, description: null is the overall monthly limit }
        currency: { $ref: "#/components/schemas/Currency" }
        amount_minor: { type: integer, format: int64 }
        spent_minor: { type: integer, format: int64, description: "Expenses incl. installment purchases; transfers, debts and installment payments excluded" }
        remaining_minor: { type: integer, format: int64, description: Negative when over budget }

    NewPlanItem:
      type: object
      required: [title, amount_min_minor, priority]
      properties:
        title: { type: string, maxLength: 64 }
        category_id: { type: [integer, "null"], format: int64, description: Expense category }
        amount_min_minor: { type: integer, format: int64, minimum: 1 }
        amount_max_minor: { type: integer, format: int64, description: "0 or omitted: same as min. The plan uses the max: conservative." }
        priority: { type: string, enum: [must, should, nice] }
        due_on: { type: [string, "null"], format: date }
        note: { type: string, maxLength: 200 }

    PlanDecision:
      type: object
      required: [group, reason, suggest_month, monthly_saving_minor, months, from_savings_minor, left_after_minor]
      properties:
        group: { type: string, enum: [fits, later, reconsider] }
        reason:
          type: string
          enum: [must, fixed_date, fits, before_salary, not_enough, too_large, postponed, must_shortfall]
          description: |
            must: a Must item, placed first. fixed_date: has a date this month and fits. fits: fits in what is left.
            before_salary: due before income_day and cash until then is short. not_enough: not enough left this month.
            too_large / postponed: a Nice item large compared with free money (postponed: carried over 2+ times).
            must_shortfall: a Must item placed although money is short; the plan's left_minor goes negative.
        suggest_month: { type: [string, "null"], example: 2026-12, description: When it becomes affordable }
        monthly_saving_minor: { type: integer, format: int64, description: Suggested monthly saving for large items; 0 otherwise }
        months: { type: integer, description: Months of that saving }
        from_savings_minor: { type: integer, format: int64, description: "Should items: lowering savings once by this much makes it fit now; 0 otherwise" }
        left_after_minor: { type: [integer, "null"], format: int64, description: "fits group only: free money left after this item and the ones placed before it" }

    PlanItem:
      type: object
      required: [id, title, category_id, amount_min_minor, amount_max_minor, priority, due_on, status, postponed_count, transaction_id, note, decision]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        category_id: { type: [integer, "null"], format: int64 }
        amount_min_minor: { type: integer, format: int64 }
        amount_max_minor: { type: integer, format: int64 }
        priority: { type: string, enum: [must, should, nice] }
        due_on: { type: [string, "null"], format: date }
        status: { type: string, enum: [planned, bought, postponed, dropped] }
        postponed_count: { type: integer, description: Times carried over from earlier months }
        transaction_id: { type: [integer, "null"], format: int64, description: The purchase, once bought }
        note: { type: string }
        decision: { oneOf: [{ $ref: "#/components/schemas/PlanDecision" }, { type: "null" }], description: Only for planned items }

    PlanView:
      type: object
      required: [month, currency, inputs, result, items]
      properties:
        month: { type: string, example: 2026-11 }
        currency: { $ref: "#/components/schemas/Currency" }
        inputs:
          type: object
          description: "Free money = income − reserved − savings − buffer. Every figure is shown with its source so the plan is explainable."
          required: [income_minor, income_source, income_override, income_day, reserved_minor, lines, savings_minor, buffer_minor, buffer_source, buffer_override, cash_now_minor]
          properties:
            income_minor: { type: integer, format: int64 }
            income_source: { type: string, enum: [override, recurring, history, none], description: "history: the lowest of the last 3 months with income (conservative)" }
            income_override: { type: boolean }
            income_day: { type: integer, description: Day the main income arrives }
            reserved_minor: { type: integer, format: int64, description: Sum of lines }
            lines:
              type: array
              items:
                type: object
                required: [kind, ref_id, title, amount_minor, due_on]
                properties:
                  kind: { type: string, enum: [recurring, installment, debt] }
                  ref_id: { type: integer, format: int64, description: "The recurring item, installment plan or debt: /recurring, /installments/{id}, /debts/{id}" }
                  title: { type: string }
                  amount_minor: { type: integer, format: int64 }
                  due_on: { type: [string, "null"], format: date }
            savings_minor: { type: integer, format: int64 }
            buffer_minor: { type: integer, format: int64, description: "Everyday spending (groceries, cafes, transport, taxi, fuel) for the month" }
            buffer_source: { type: string, enum: [override, history, none] }
            buffer_override: { type: boolean }
            cash_now_minor: { type: integer, format: int64 }
        result:
          type: object
          required: [free_minor, allocated_minor, left_minor]
          properties:
            free_minor: { type: integer, format: int64 }
            allocated_minor: { type: integer, format: int64 }
            left_minor: { type: integer, format: int64 }
        items: { type: array, items: { $ref: "#/components/schemas/PlanItem" } }

    Recurring:
      type: object
      required: [id, kind, title, category_id, currency, amount_minor, day_of_month, account_id]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [income, expense] }
        title: { type: string }
        category_id: { type: [integer, "null"], format: int64 }
        currency: { $ref: "#/components/schemas/Currency" }
        amount_minor: { type: integer, format: int64 }
        day_of_month: { type: integer }
        account_id: { type: [integer, "null"], format: int64 }

    Transaction:
      type: object
      required: [id, type, occurred_on, amount_minor, currency, account_id, description, source, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/TransactionType" }
        occurred_on: { type: string, format: date }
        amount_minor: { type: integer, format: int64 }
        currency: { $ref: "#/components/schemas/Currency" }
        account_id: { type: [integer, "null"], format: int64, description: "null for a debt or installment that moved no money" }
        to_account_id: { type: [integer, "null"], format: int64 }
        to_amount_minor: { type: [integer, "null"], format: int64 }
        to_currency: { oneOf: [{ $ref: "#/components/schemas/Currency" }, { type: "null" }] }
        category_id: { type: [integer, "null"], format: int64 }
        description: { type: string }
        source: { $ref: "#/components/schemas/Source" }
        created_at: { type: string, format: date-time }
        debt_id: { type: [integer, "null"], format: int64 }
        installment_id: { type: [integer, "null"], format: int64 }
        debt_direction: { type: [string, "null"], enum: [lent, borrowed, null], description: For debt and debt_payment }
        counterparty: { type: [string, "null"], description: The person, for debt and debt_payment }

    Summary:
      type: object
      required: [month, balances, income, expense, by_category, recent, owed_to_me, i_owe, installments]
      properties:
        month: { type: string, example: 2026-10 }
        balances: { type: array, description: Total of asset accounts with include_in_total per currency, items: { $ref: "#/components/schemas/Money" } }
        income: { type: array, items: { $ref: "#/components/schemas/Money" } }
        expense: { type: array, items: { $ref: "#/components/schemas/Money" } }
        by_category:
          type: array
          description: Expense per category and currency, largest first
          items:
            type: object
            required: [category_id, amount_minor, currency]
            properties:
              category_id: { type: integer, format: int64 }
              amount_minor: { type: integer, format: int64 }
              currency: { $ref: "#/components/schemas/Currency" }
        recent: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Transaction" } }
        owed_to_me: { type: array, description: Open debts owed to the user, per currency, items: { $ref: "#/components/schemas/Money" } }
        i_owe: { type: array, description: Open debts the user owes, per currency, positive, items: { $ref: "#/components/schemas/Money" } }
        installments: { type: array, description: Left to pay on installment plans, per currency, positive, items: { $ref: "#/components/schemas/Money" } }
