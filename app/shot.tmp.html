<!doctype html><html><body style="margin:0;background:#888">
<iframe id="f" style="border:0;width:360px;height:100vh;display:block"></iframe>
<script>
const p = new URLSearchParams(location.search)
const f = document.getElementById('f')
const dark = p.get('dark') === '1'
const theme = dark ? { bg_color: '#17212b', secondary_bg_color: '#0e1621', text_color: '#f5f5f5', hint_color: '#708499', button_color: '#5288c1', button_text_color: '#ffffff' } : { bg_color: '#ffffff', secondary_bg_color: '#efeff4', text_color: '#000000', hint_color: '#999999', button_color: '#2481cc', button_text_color: '#ffffff' }
const hash = new URLSearchParams({ tgWebAppData: 'user=%7B%22id%22%3A42%2C%22first_name%22%3A%22Dilnoza%22%7D&auth_date=1&hash=x', tgWebAppVersion: '8.0', tgWebAppPlatform: 'ios', tgWebAppThemeParams: JSON.stringify(theme) })
localStorage.setItem('bp.prefs', JSON.stringify({ theme: 'system', categoryStyle: 'icons', hideAmounts: p.get('hide') === '1' }))
f.src = '/#' + hash.toString()
setTimeout(() => { f.contentWindow.location.hash = '#' + (p.get('route') || '/') }, 2500)
</script></body></html>
